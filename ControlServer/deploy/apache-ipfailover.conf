# IP Failover control server — Apache 2.4 virtual host.
# Assumes the ControlServer folder lives at /var/www/ipfailover.
#   cp deploy/apache-ipfailover.conf /etc/apache2/sites-available/ipfailover.conf
#   (edit ServerName)   a2enmod headers ssl   a2ensite ipfailover   systemctl reload apache2
#   certbot --apache -d ipctl.example.com        <- strongly recommended
#
# Agents are safe over plain HTTP (their traffic is end-to-end encrypted and
# signed), but your admin login is not, and allowlist feeds refuse plain HTTP.

<VirtualHost *:80>
    ServerName ipctl.example.com
    DocumentRoot /var/www/ipfailover/public

    # Nothing outside public/ is ever served: config.php, data/ (database,
    # encryption key), src/, bin/ and agents/ stay off the web.
    <Directory /var/www/ipfailover>
        Require all denied
    </Directory>
    <Directory /var/www/ipfailover/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
    </Directory>

    # Agent requests are small; refuse anything big before PHP sees it.
    <Location /api/>
        LimitRequestBody 65536
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/ipfailover-error.log
    CustomLog ${APACHE_LOG_DIR}/ipfailover-access.log combined
</VirtualHost>

# Behind HAProxy / another reverse proxy? Add the proxy's address to
# 'trusted_proxies' in config.php, or every agent will look like it comes from
# the proxy and its IP will be held (the dashboard tells you when this happens).
