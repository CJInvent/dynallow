# Container vhost. TLS is terminated by whatever is in front (HAProxy, Caddy,
# nginx, Cloudflare Tunnel); list that proxy in DYNALLOW_TRUSTED_PROXIES.
ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/dynallow/public
    # Nothing outside public/ is ever served: config.php, data/, src/, bin/, agents/.
    <Directory /var/www/dynallow>
        Require all denied
    </Directory>
    <Directory /var/www/dynallow/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
    </Directory>
    # Agent requests are small; refuse anything big before PHP sees it.
    <Location /api/>
        LimitRequestBody 65536
    </Location>
    # Logs (including the audit mirror) go to `docker logs` for external collection.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
