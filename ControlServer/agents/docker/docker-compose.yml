# IP Failover agent. Stock PHP image with immutable launcher, verifier, and base agent.
services:
  ipfailover-agent:
    image: php:8.3-cli-alpine
    container_name: ipfailover-agent
    restart: unless-stopped
    command: ["php", "/app/launcher.php"]
    init: true
    environment:
      DATA_DIR: /data
    volumes:
      - ./app:/app:ro
      - ./data:/data
      # Lets the server notice if this identity is copied to other hardware.
      - /etc/machine-id:/host-machine-id:ro
    user: "65534:65534"          # nobody; the agent needs no privileges at all
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "php", "/app/launcher.php", "health"]
      interval: 60s
      timeout: 20s
      start_period: 90s
      retries: 2
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
